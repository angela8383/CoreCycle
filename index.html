<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="CoreCycle - marketplace de retiro de voluminosos en propiedad horizontal.">
<title>CoreCycle Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFE7D6; --paper2:#FBF8F0; --ink:#26241F; --ink-soft:#5B584E;
  --petrol:#1E4640; --petrol2:#2C5C54; --rust:#B5502E; --ochre:#C99A2E;
  --sage:#6B8F71; --line:rgba(38,36,31,.16); --line2:rgba(38,36,31,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
.serif{font-family:'Fraunces',Georgia,serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- cabecera ---------- */
header{background:var(--paper)}
.head-in{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:6px;background:var(--petrol);color:var(--ochre);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.brand h1{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600;margin:0;line-height:1}
.brand p{margin:3px 0 0;font-size:11.5px;color:var(--ink-soft)}
.head-right{display:flex;align-items:center;gap:10px}
.bell{position:relative;border:1px solid var(--line);background:var(--paper2);border-radius:6px;
  width:34px;height:34px;cursor:pointer;font-size:15px;flex:0 0 auto;color:var(--ink)}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--rust);color:#fff;border-radius:999px;
  font-size:10px;padding:1px 5px;font-weight:500;line-height:1.4}
.acct{display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:999px;background:var(--petrol);color:var(--paper2);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;flex:0 0 auto}
.acct select{width:auto;max-width:230px;font-size:13px;padding:7px 9px}

/* ---------- pestañas ---------- */
.tabs-bar{border-bottom:1px solid var(--line);background:var(--paper)}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{border:0;background:transparent;padding:11px 14px;font:inherit;font-size:14px;color:var(--ink-soft);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--petrol);font-weight:500}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--petrol);outline-offset:-4px}

main{padding:26px 0 50px}
.stack{display:flex;flex-direction:column;gap:18px}
.cols{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.col-main{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:18px}
.col-side{width:300px;flex:0 0 auto;display:flex;flex-direction:column;gap:18px}
@media(max-width:820px){.col-side{width:100%}}

/* ---------- superficies ---------- */
.card{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:20px}
.card.flat{background:transparent;border-color:var(--line2)}
h2.sec{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600;margin:0;text-wrap:balance}
h3.sec{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:600;margin:0}
.display{font-family:'Fraunces',Georgia,serif;font-size:27px;font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
@media(max-width:560px){.display{font-size:23px}}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
.xs{font-size:12px}
.lede{max-width:62ch;margin:6px 0 0;color:var(--ink-soft)}
.hr{height:1px;background:var(--line);margin:14px 0}
.cap{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px}
.headrow{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.linkish{border:0;background:transparent;color:var(--petrol);font:inherit;font-size:13px;cursor:pointer;padding:0;text-decoration:underline}

/* ---------- controles ---------- */
button.primary{background:var(--petrol);color:var(--paper2);border:0;border-radius:6px;
  padding:10px 18px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
button.primary:hover{background:var(--petrol2)}
button.primary.lg{padding:13px 22px;font-size:15px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;
  padding:8px 13px;font:inherit;font-size:13px;cursor:pointer}
button.ghost:hover{background:var(--paper)}
button:focus-visible,select:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
input,select{border:1px solid var(--line);background:var(--paper2);border-radius:6px;
  padding:9px 10px;font:inherit;font-size:14px;width:100%;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--petrol);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:5px}
label.f>span{font-size:12px;color:var(--ink-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- píldoras de estado ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;white-space:nowrap}
.pill.ok{background:rgba(107,143,113,.18);color:#37543d}
.pill.act{background:rgba(201,154,46,.20);color:#6f5310}
.pill.neu{background:var(--line2);color:var(--ink-soft)}
.flash{display:flex;gap:10px;align-items:center;border:1px solid var(--sage);border-left-width:3px;
  border-radius:8px;padding:12px 15px;background:var(--paper2);font-size:13.5px}

/* ---------- solicitud activa ---------- */
.active{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;
  border:1px solid var(--petrol);border-radius:10px;padding:18px 20px;background:var(--paper2)}
@media(max-width:640px){.active{grid-template-columns:1fr}}
.active .t{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;margin:4px 0 2px}
.cta{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:10px;padding:20px;background:var(--paper2)}

/* ---------- inicio residente ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;
  background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:18px 16px;
  font:inherit;color:var(--ink);cursor:pointer;min-height:116px}
.tile:hover{border-color:var(--petrol);background:#fff}
.tile .ic{font-size:26px;line-height:1}
.tile .t{font-weight:500;font-size:15px}
.tile .s{font-size:12px;color:var(--ink-soft);margin-top:auto}
.trust{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--paper);border:1px solid var(--line2);border-radius:8px;padding:11px 14px;font-size:13px}

/* ---------- listas ---------- */
.list{display:flex;flex-direction:column;gap:0}
.li{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;
  padding:13px 0;border-top:1px solid var(--line2);font-size:14px;text-align:left;
  background:transparent;border-left:0;border-right:0;border-bottom:0;font-family:inherit;color:var(--ink);width:100%;cursor:pointer}
.li:first-child{border-top:0}
.li:hover{background:var(--paper)}
.li .s{font-size:12px;color:var(--ink-soft);margin-top:2px}
.li .amt{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
@media(max-width:560px){.li{grid-template-columns:1fr auto}.li .amt{grid-column:2}}

/* ---------- progreso ---------- */
.prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.prog .p{display:flex;align-items:center;gap:7px;color:var(--ink-soft)}
.prog .p.on{color:var(--ink);font-weight:500}
.prog .n{width:21px;height:21px;border-radius:999px;border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
.prog .p.on .n{background:var(--petrol);border-color:var(--petrol);color:var(--paper2)}
.prog .p.done .n{background:var(--sage);border-color:var(--sage);color:#fff}
.prog .sep{width:14px;height:1px;background:var(--line)}

/* ---------- fotos ---------- */
.photos{display:flex;gap:10px;flex-wrap:wrap}
.ph{width:88px;height:88px;border-radius:8px;border:1px dashed var(--line);background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:11px;color:var(--ink-soft);cursor:pointer}
.ph.filled{border-style:solid;border-color:var(--line);background:var(--petrol);color:var(--paper2);font-size:22px}

/* ---------- ofertas ---------- */
.sorts{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;
  font:inherit;font-size:13px;cursor:pointer;color:var(--ink-soft);white-space:nowrap}
.chip.on{background:var(--petrol);border-color:var(--petrol);color:var(--paper2)}
.offer{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;
  background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.offer.best{border-color:var(--petrol);border-width:2px;padding:15px 17px}
.offer .name{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600;margin:0}
.offer .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin-top:5px}
.offer .quote{font-size:12.5px;color:var(--ink-soft);margin:9px 0 0;max-width:56ch;font-style:italic}
.offer .price{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
  font-size:22px;text-align:right;white-space:nowrap}
.offer .right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
@media(max-width:600px){.offer{grid-template-columns:1fr}.offer .right{align-items:stretch}.offer .price{text-align:left}}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11px;
  background:var(--petrol);color:var(--paper2)}
.tag.alt{background:var(--sage);color:#fff}
.verif{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--paper);
  border-radius:999px;padding:3px 9px;font-size:11px;color:var(--ink-soft)}
.verif b{font-weight:500;color:var(--ink)}
.ref-line{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;
  background:var(--paper);border:1px solid var(--line2);border-radius:8px;padding:12px 15px;font-size:13px}
.strike{text-decoration:line-through;color:var(--ink-soft)}

/* ---------- resumen / portería ---------- */
.row{display:flex;justify-content:space-between;gap:14px;font-size:14px;padding:4px 0}
.row b{font-weight:600}
.gate{border:1px solid var(--line);border-radius:8px;padding:15px;background:var(--paper)}
.gate dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.gate dt{color:var(--ink-soft)}
.gate dd{margin:0;font-weight:500}

/* ---------- seguimiento ---------- */
.steps-wrap{overflow-x:auto}
.steps{display:flex;min-width:430px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:104px}
.dot{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.dot.on{background:var(--petrol);border-color:var(--petrol);color:var(--paper2)}
.dot.now{background:var(--ochre);border-color:var(--ochre);color:var(--ink)}
.step span{font-size:12px;text-align:center;line-height:1.25;max-width:104px;color:var(--ink-soft)}
.step.on span{color:var(--ink)}
.bar{flex:1;height:1px;background:var(--line);margin:16px 2px 0}
.bar.on{background:var(--petrol)}
.tl{display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:9px 0;border-top:1px solid var(--line2);font-size:14px}
.tl-item:first-child{border-top:0}
.tl-item time{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12px;padding-top:2px}

/* ---------- certificado ---------- */
.ticket{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:26px 22px 22px;
  background-image:radial-gradient(circle at center,var(--paper) 5.2px,transparent 5.6px);
  background-size:18px 14px;background-repeat:repeat-x;background-position:top left}
.cert-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.cert-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin:0}
.cert-grid dt{color:var(--ink-soft)}
.cert-grid dd{margin:0}
.mat{display:flex;flex-direction:column;gap:7px}
.mat-row{display:grid;grid-template-columns:118px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.mat-bar{height:9px;border-radius:3px;background:var(--line2);overflow:hidden}
.mat-bar i{display:block;height:100%;border-radius:3px;background:var(--sage)}
.mat-row.final .mat-bar i{background:var(--ink-soft)}
.mat-row .n{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.qr{width:104px;height:104px;flex:0 0 auto}
.badge{background:var(--paper);border:1px solid var(--line2);border-radius:8px;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .k{font-size:12px;color:var(--ink-soft);margin:0 0 6px}
.kpi .v{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:23px;line-height:1.1}
.kpi .d{font-size:11px;color:var(--ink-soft);margin-top:4px}
.kpi .d.up{color:var(--sage)}
.kpi .d.down{color:var(--rust)}

/* ---------- embudo ---------- */
.funnel{display:flex;flex-direction:column;gap:11px}
.fn{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media(max-width:560px){.fn{grid-template-columns:1fr}}
.fn .lab{font-size:13px}
.fn .lab i{display:block;font-style:normal;font-size:11px;color:var(--ink-soft)}
.fn .track{position:relative;height:30px;display:flex;align-items:center}
.fn .fill{height:30px;border-radius:0 4px 4px 0;background:var(--petrol);min-width:3px}
.fn .n{position:absolute;left:11px;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
  font-size:13px;color:var(--paper2)}
.fn .n.out{position:static;margin-left:9px;color:var(--ink)}

/* ---------- barras ---------- */
.vbars{display:flex;align-items:flex-end;gap:5px;height:130px}
.vb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.vb i{display:block;background:var(--petrol);border-radius:4px 4px 0 0;min-height:3px}
.vb.peak i{background:var(--ochre)}
.vb.sage i{background:var(--sage)}
.vbx{display:flex;gap:5px;margin-top:6px}
.vbx span{flex:1;text-align:center;font-size:10px;color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;overflow:hidden}
.vbv{display:flex;gap:5px;margin-bottom:5px}
.vbv span{flex:1;text-align:center;font-size:10.5px;color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:104px 1fr 62px;gap:11px;align-items:center;font-size:13px}
.hb .track{height:16px;border-radius:3px;background:var(--line2);overflow:hidden}
.hb .track i{display:block;height:100%;border-radius:3px;background:var(--petrol)}

/* ---------- alertas ---------- */
.alert{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--rust);border-left-width:3px;
  border-radius:8px;padding:12px 15px;background:var(--paper2);font-size:13px}
.alert .ic{font-size:15px;line-height:1.3}
.alert b{display:block;margin-bottom:2px}

/* ---------- tabla ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:400;color:var(--ink-soft);padding:0 10px 7px 0;font-size:12px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
td.n,th.n{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.minibar{height:7px;border-radius:2px;background:var(--line2);min-width:60px;overflow:hidden;display:block}
.minibar i{display:block;height:100%;background:var(--petrol);border-radius:2px}

/* ---------- solicitudes del gestor ---------- */
.req{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  border:1px solid var(--line);border-radius:8px;padding:13px 15px;background:var(--paper2)}
.req .t{font-weight:500}
.req .m{font-size:12px;color:var(--ink-soft);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:600px){.req{grid-template-columns:1fr}}
.warnpill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;
  font-size:11px;background:rgba(181,80,46,.12);color:var(--rust)}

/* ---------- cascada de precios ---------- */
.wf{display:flex;gap:14px;height:250px;align-items:flex-end;min-width:620px}
.wf-wrap{overflow-x:auto;padding-top:10px}
.wf-col{flex:1;position:relative;height:100%}
.wf-bar{position:absolute;left:0;right:0;border-radius:3px}
.wf-bar.base{background:var(--petrol)}
.wf-bar.down{background:var(--sage)}
.wf-bar.up{background:var(--rust)}
.wf-val{position:absolute;left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-variant-numeric:tabular-nums;font-size:12px;transform:translateY(-20px)}
.wf-link{position:absolute;right:-14px;width:14px;border-top:1px dashed var(--line);height:0}
.wfx{display:flex;gap:14px;margin-top:9px;min-width:620px}
.wfx span{flex:1;text-align:center;font-size:11px;color:var(--ink-soft);line-height:1.3}
.wf-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:14px}
.wf-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* ---------- pie ---------- */
footer{border-top:1px solid var(--line);background:var(--paper)}
.foot-in{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:24px 0 34px;
  font-size:12px;color:var(--ink-soft)}
.foot-in nav{display:flex;gap:18px;flex-wrap:wrap}
.foot-in a{color:var(--ink-soft);text-decoration:none}
.foot-in a:hover{color:var(--ink);text-decoration:underline}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <div class="brand">
      <div class="logo">♻</div>
      <div>
        <h1>CoreCycle</h1>
        <p>Retiro de voluminosos · Bogotá</p>
      </div>
    </div>
    <div class="head-right">
      <button class="bell" aria-label="Notificaciones">🔔<b>2</b></button>
      <span class="acct">
        <span class="avatar" id="avatar">MT</span>
        <select id="acct" aria-label="Cuenta">
          <option value="res">Marcela Torres — Residente</option>
          <option value="ges">EcoRetiro Bogotá — Gestor</option>
          <option value="plat">CoreCycle — Administración</option>
        </select>
      </span>
    </div>
  </div>
</header>

<div class="tabs-bar">
  <div class="wrap"><div class="tabs" id="tabs"></div></div>
</div>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap foot-in">
    <nav>
      <a href="#">Cómo funciona</a><a href="#">Ser gestor aliado</a><a href="#">Ayuda</a>

    out.push({...s, desde:Math.min(v,nv), hasta:Math.max(v,nv), delta:nv - v});
    v = nv;
  });
  return out;
}
function qrSVG(size){
  const N = 21, c = size / N;
  let seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  let r = '';
  const finder = (ox, oy) => {
    r += `<rect x="${ox*c}" y="${oy*c}" width="${7*c}" height="${7*c}" fill="var(--ink)"/>`;
    r += `<rect x="${(ox+1)*c}" y="${(oy+1)*c}" width="${5*c}" height="${5*c}" fill="var(--paper2)"/>`;
    r += `<rect x="${(ox+2)*c}" y="${(oy+2)*c}" width="${3*c}" height="${3*c}" fill="var(--ink)"/>`;
  };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if ((x < 8 && y < 8) || (x > N-9 && y < 8) || (x < 8 && y > N-9)) continue;
    if (rnd() > 0.52) r += `<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="var(--ink)"/>`;
  }
  finder(0,0); finder(N-7,0); finder(0,N-7);
  return `<svg class="qr" viewBox="0 0 ${size} ${size}" role="img" aria-label="Código QR de verificación">
    <rect width="${size}" height="${size}" fill="var(--paper2)"/>${r}</svg>`;
}

    <div>
      <h2 class="display">Precios</h2>
      <p class="lede">Cómo se forma el precio promedio del marketplace frente a la referencia del mercado informal.</p>
    </div>
    <div class="kpis">
      <div class="kpi"><p class="k">Precio promedio</p><div class="v">${money(r1000(FINAL))}</div><div class="d down">−32% vs. referencia informal</div></div>
      <div class="kpi"><p class="k">Referencia informal</p><div class="v">${money(REF)}</div><div class="d">un solo transportador, sin comparar</div></div>
      <div class="kpi"><p class="k">Comisión por retiro</p><div class="v">${money(r1000(FINAL*0.15))}</div><div class="d">15% cobrado al gestor</div></div>
      <div class="kpi"><p class="k">Sin densidad de ruta</p><div class="v">$132.000</div><div class="d">zonas con menos de 3 gestores</div></div>
    </div>
    <div class="card">
      <h2 class="sec">Formación del precio</h2>
      <p class="xs muted" style="margin:5px 0 4px">Lote de referencia, en pesos</p>
      <div class="wf-wrap">
        <div class="wf">
          ${serie.map((s,i) => {
            const cls = s.tipo === 'base' ? 'base' : s.tipo === 'down' ? 'down' : 'up';
            const runAfter = s.tipo === 'base' ? s.hasta : (s.tipo === 'down' ? s.desde : s.hasta);
            const lbl = s.delta === null ? money(s.hasta) : (s.delta > 0 ? '+' : '−') + money(Math.abs(s.delta));
            return `<div class="wf-col">
              <span class="wf-bar ${cls}" style="bottom:${pct(s.desde).toFixed(1)}%;height:${pct(s.hasta - s.desde).toFixed(1)}%" title="${esc(s.lab)}: ${lbl}"></span>
              <span class="wf-val" style="bottom:${pct(s.hasta).toFixed(1)}%">${lbl}</span>
              ${i < serie.length - 1 ? `<span class="wf-link" style="bottom:${pct(runAfter).toFixed(1)}%"></span>` : ''}
            </div>`;
          }).join('')}
        </div>
        <div class="wfx">${serie.map(s => `<span>${esc(s.lab)}</span>`).join('')}</div>
      </div>
      <div class="wf-legend">
        <span><i style="background:var(--petrol)"></i>Precio total</span>
        <span><i style="background:var(--sage)"></i>Baja el precio</span>
        <span><i style="background:var(--rust)"></i>Lo sube</span>
      </div>
    </div>
    <div class="cols">
      <div class="col-main">
        <div class="card">
          <h2 class="sec">Qué mueve cada componente</h2>
          <div class="hr"></div>
          <div class="tbl-wrap"><table>
            <thead><tr><th>Componente</th><th class="n">Efecto</th><th>Cómo se monitorea</th></tr></thead>
            <tbody>
              <tr><td>Competencia entre gestores</td><td class="n">−22%</td><td class="small muted">Dispersión entre la oferta más baja y la más alta por solicitud</td></tr>
              <tr><td>Aprovechamiento del material</td><td class="n">−12%</td><td class="small muted">Precio de gestores con planta propia frente a solo transporte</td></tr>
              <tr><td>Densificación de ruta</td><td class="n">−8%</td><td class="small muted">Precio con dos o más retiros el mismo día en el corredor</td></tr>
              <tr><td>Comisión trasladada</td><td class="n">+7%</td><td class="small muted">Variación del precio ofertado ante cambios en la tarifa de comisión</td></tr>
            </tbody></table></div>
        </div>
      </div>
      <div class="col-side">
        <div class="card">
          <h3 class="sec">Política de precio en firme</h3>
          <div class="hr"></div>
          <p class="small muted" style="margin:0 0 10px">El precio aceptado por el residente no puede modificarse el día de la recogida.</p>
          <p class="small muted" style="margin:0">Si el gestor encuentra condiciones distintas a las declaradas, CoreCycle cubre la diferencia y la reclama por separado.</p>
        </div>
      </div>
    </div>
  </div>`;
}

/* ===================== router ===================== */
const VISTAS = {
  res:  {inicio:resInicio, solicitar:resSolicitar, retiros:resRetiros},
  ges:  {tablero:gesTablero, solicitudes:gesSolicitudes, historial:gesHistorial},
  plat: {consolidado:platConsolidado, impacto:platImpacto, precios:platPrecios}
};

function render(){
  const c = CUENTAS[S.acct];
  document.getElementById('avatar').textContent = c.ini;
  document.getElementById('acct').value = S.acct;
  document.getElementById('tabs').innerHTML = c.secs.map(([id,lab]) =>
    `<button class="tab ${S.sec===id?'on':''}" data-sec="${id}">${lab}</button>`).join('');
  document.getElementById('app').innerHTML = VISTAS[S.acct][S.sec]();
  window.scrollTo({top:0, behavior:'instant'});
}

document.getElementById('acct').addEventListener('change', e => {
  S.acct = e.target.value;
  S.sec = CUENTAS[S.acct].secs[0][0];
  S.abierto = null; S.paso = 1; S.flash = null;
  render();
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-sec],[data-tipo],[data-orden],[data-elegir],[data-paso],[data-open],[data-confirmar]');
  if (!t) return;
  if (t.dataset.sec !== undefined)  { S.sec = t.dataset.sec; S.abierto = null; S.paso = 1; S.flash = null; }
  if (t.dataset.tipo)               { S.tipo = t.dataset.tipo; }
  if (t.dataset.orden)              { S.orden = t.dataset.orden; }
  if (t.dataset.paso)               { S.paso = +t.dataset.paso; }
  if (t.dataset.elegir)             { S.gestor = t.dataset.elegir; S.paso = 3; }
  if (t.dataset.open !== undefined) { S.abierto = t.dataset.open || null; S.sec = 'retiros'; }
  if (t.dataset.confirmar) {
    S.sec = 'inicio'; S.paso = 1;
    S.flash = `Recogida confirmada con ${gestorById(S.gestor).nombre}. Enviamos la ficha a portería.`;
  }
  render();
});

render();
</script>

</body>
</html>
